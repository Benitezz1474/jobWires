<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar">
                    <div class="avatar-icon"></div>
                </div>
                <div class="user-details">
                    <h3>ProveedorNombre</h3>
                    <div class="status">En línea</div>
                </div>
            </div>
            <div class="service-info">
                <h4>MiServicio</h4>
                <div class="service-date">16 de agosto de<br>2025 - 14:00</div>
                <button class="service-btn">Ver detalles del servicio</button>
            </div>
        </div>

        <div class="chat-messages">
            <!-- Los mensajes aparecerán aquí -->
        </div>

        <div class="chat-input">
            <div class="input-container">
                <input type="text" class="message-input" placeholder="Escribir un mensaje...">
                <button class="send-btn">Enviar</button>
            </div>
        </div>
    </div>
</body>
</html>
