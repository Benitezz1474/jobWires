<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscar Servicios de Oficina | ServiciosFácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="busca.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="header">
    <nav class="nav">
      <div class="logo">ServiciosFácil</div>
      <ul class="nav-links">
        <li><a href="./CONTENT/PUBLICAR/index.html">Publicar</a></li>
         <li><a href="/index.html">Inicio</a></li>
        <li><a href="/CONTENT/CONFIGURACIONES/index.html">Ajustes</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <!-- Main Header Section -->
    <header class="main-header">
      <h1 class="main-title">
        <span class="title-highlight">Encuentra</span> el servicio perfecto
      </h1>
      <p class="subtitle">Conectamos tu oficina con los mejores profesionales</p>
      
      <div class="search-section">
        <div class="search-bar">
          <div class="search-input-wrapper">
            <svg class="search-icon-input" viewBox="0 0 24 24">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input
              type="text"
              class="search-input"
              placeholder="Buscar electricistas, fontaneros, limpieza..."
              id="searchInput"
            />
          </div>
          <button class="search-btn" onclick="buscarServicios()">
            <span>Buscar</span>
            <svg class="search-icon" viewBox="0 0 24 24">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </button>
        </div>
        
        <!-- Quick Search Categories -->
        <div class="quick-categories">
          <button class="category-chip" data-category="electricista">⚡ Electricista</button>
          <button class="category-chip" data-category="fontaneria">🔧 Sanitaria</button>
          <button class="category-chip" data-category="limpieza">🧹 Limpieza</button>
          <button class="category-chip" data-category="informatica">💻 Informática</button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Sidebar Filters -->
      <aside class="sidebar">
        <div class="filters-header">
          <h3>Filtros</h3>
          <button class="clear-filters" id="clearFilters">Limpiar</button>
        </div>
        
        <div class="filters-content">
          <div class="filter-group">
            <label class="filter-label">
              <svg class="filter-icon" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
              Categoría
            </label>
            <select class="filter-select" id="categoryFilter">
              <option value="">Todas las categorías</option>
              <option value="electricista">⚡ Electricista</option>
              <option value="fontaneria">🔧 Sanitaria</option>
              <option value="limpieza">🧹 Limpieza</option>
              <option value="mantenimiento">🔨 Mantenimiento</option>
              <option value="informatica">💻 Informática</option>
              <option value="seguridad">🛡️ Seguridad</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label">
              <svg class="filter-icon" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
              Ubicación
            </label>
            <select class="filter-select" id="locationFilter">
              <option value="">Seleccione ubicación...</option>
              <option value="montevideo">📍 Montevideo</option>
              <option value="canelones">📍 Canelones</option>
              <option value="maldonado">📍 Maldonado</option>
              <option value="colonia">📍 Colonia</option>
              <option value="paysandu">📍 Paysandú</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label">
              <svg class="filter-icon" viewBox="0 0 24 24">
                <path d="M11.8 10.9c-.9 0-1.6.7-1.6 1.6s.7 1.6 1.6 1.6 1.6-.7 1.6-1.6-.7-1.6-1.6-1.6zM7.5 11.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5-2 4.5-4.5 4.5-4.5-2-4.5-4.5zM5 9c0-3.9 3.1-7 7-7s7 3.1 7 7-3.1 7-7 7-7-3.1-7-7z"/>
              </svg>
              Rango de precio (USD)
            </label>
            <div class="price-inputs">
              <input type="number" class="price-input" placeholder="Mín" id="minPrice" />
              <span class="price-separator">-</span>
              <input type="number" class="price-input" placeholder="Máx" id="maxPrice" />
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label">
              <svg class="filter-icon" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
              Calificación mínima
            </label>
            <div class="rating-filter" id="ratingFilter">
              <span class="star" data-rating="1">★</span>
              <span class="star" data-rating="2">★</span>
              <span class="star" data-rating="3">★</span>
              <span class="star" data-rating="4">★</span>
              <span class="star" data-rating="5">★</span>
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label">
              <svg class="filter-icon" viewBox="0 0 24 24">
                <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.1 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
              </svg>
              Disponibilidad
            </label>
            <select class="filter-select" id="availabilityFilter">
              <option value="">Seleccione...</option>
              <option value="inmediata">🟢 Disponible ahora</option>
              <option value="24h">🟡 Dentro de 24h</option>
              <option value="semana">🟠 Esta semana</option>
              <option value="mes">🔴 Este mes</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Services Grid -->
      <section class="services-grid">
        <div class="results-header">
          <h2 id="resultsTitle">Servicios disponibles</h2>
          <div class="sort-controls">
            <label>Ordenar por:</label>
            <select class="sort-select" id="sortSelect">
              <option value="relevance">Relevancia</option>
              <option value="rating">Mejor calificados</option>
              <option value="price-low">Precio: menor a mayor</option>
              <option value="price-high">Precio: mayor a menor</option>
            </select>
          </div>
        </div>
        
        <div class="services-container" id="servicesContainer">
          <!-- Services will be dynamically generated -->
          <div class="loading-placeholder">
            <div class="loading-spinner"></div>
            <p>Cargando servicios...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Mobile Filter Toggle -->
  <button class="mobile-filter-toggle" id="mobileFilterToggle">
    <svg viewBox="0 0 24 24">
      <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
    </svg>
    Filtros
  </button>
  <script src="buscar.js"></script>
</body>
</html>
