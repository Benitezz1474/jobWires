<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="../registerAndRegister.css">
  <link rel="stylesheet" href="../general.css">
</head>
<body class="registro-page">

  <header>
       <div class="logo">
        <a href="../index.html"><h2>jobsWebSites</h2></a>
       </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li ><a href="../LOGIN/index.html">Login</a></li>
                <li class="linkActually"><a href="./REGISTRO/index.html">Register</a></li>
            </ul>
        </nav>
    </header>

  <section>
    <div class="registro-form">
      <h2 class="titulo-form">Crear una nueva cuenta</h2>
      <form action="register.php" method="post" id="formRegister">

          <div class="input-box">
          <input type="text" id="CI" name="CI" required placeholder=" " />
          <label for="CI">CI</label>
        </div>

        <div class="input-box">
          <input type="text" id="username" name="username" required placeholder=" " />
          <label for="username">Nombre de Usuario</label>
        </div>
        <div class="input-box">
          <input type="email" id="email" name="email" required placeholder=" " />
          <label for="email">Correo Electrónico</label>
        </div>
        <div class="input-box">
          <input type="password" id="password" name="password" required placeholder=" " />
          <label for="password">Contraseña</label>
        </div>
        <div class="input-box">
          <input type="password" id="password2" name="password2" required placeholder=" " />
          <label for="password2">Confirmar Contraseña</label>
        </div>
        <div class="input-box">
          <input type="submit" value="Registrarse" id="registrarse" />
        </div>
        <!-- captcha (widget) -->
        <div class="h-captcha" data-sitekey="15de72be-48ca-4834-8716-404ecfe47838"></div>
      </form>
      <div class="message"></div>
      <div class="grupo-centrado">
        <a href="../LOGIN/login.html">¿Ya tienes una cuenta? Iniciar sesión</a>
      </div>
    </div>
  </section>

  <footer></footer>

</body>
<script type="module" src="./register.js"></script>
<script type="module" src="../loginAndRegister.js"></script>
</html>
