<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body class="registro-page">

  <header>
    <h2>logoEmpresa</h2>
      <nav class="nav">
            <div class="logo">TrabajoPlus</div>
            <ul class="nav-links">
                 <li><a href="../index.html">Inicio</a></li>
                    <li><a href="../REGISTRO/register.html" >Registrarse</a></li>
                <li><a href="../LOGIN/login.html">login</a></li>
            </ul>
        </nav>
  </header>

  <section>
    <div class="registro-form">
      <h2 class="titulo-form">Crear una nueva cuenta</h2>
      <form action="register.php" method="post" id="formRegister">

          <div class="input-box">
          <input type="text" id="CI" name="CI" required placeholder=" " />
          <label for="CI">CI</label>
        </div>

        <div class="input-box">
          <input type="text" id="username" name="username" required placeholder=" " />
          <label for="username">Nombre de Usuario</label>
        </div>
        <div class="input-box">
          <input type="email" id="email" name="email" required placeholder=" " />
          <label for="email">Correo Electrónico</label>
        </div>
        <div class="input-box">
          <input type="password" id="password" name="password" required placeholder=" " />
          <label for="password">Contraseña</label>
        </div>
        <div class="input-box">
          <input type="password" id="password2" name="password2" required placeholder=" " />
          <label for="password2">Confirmar Contraseña</label>
        </div>
        <div class="input-box">
          <input type="submit" value="Registrarse" id="registrarse" />
        </div>
      </form>
        <!-- captcha (widget) -->
        <div class="h-captcha" data-sitekey="15de72be-48ca-4834-8716-404ecfe47838"></div>
      <div class="message"></div>
      <div class="grupo-centrado">
        <a href="../LOGIN/login.html">¿Ya tienes una cuenta? Iniciar sesión</a>
      </div>
    </div>
  </section>

</body>
<script src="../sessionVerify.js"></script>
<script type="module" src="./register.js"></script>
<script type="module" src="../loginAndRegister.js"></script>
</html>
