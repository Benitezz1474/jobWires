version: "3.9"

services:
  apache:
    image: php:8.1-apache
    container_name: apache-php
    ports:
      - "8081:80"
    networks:
      - test_net
    volumes:
      - C:/xampp/htdocs/:/var/www/html

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    ports:
      - "3311:3306"
    networks:
      - test_net
    environment:
      - MARIADB_USER=root
      - MARIADB_ROOT_PASSWORD=admin

networks:
  test_net:
    driver: bridge
