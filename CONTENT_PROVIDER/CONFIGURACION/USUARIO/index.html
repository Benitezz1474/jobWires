<!-- DENTRO DE TU .subContent -->
<div class="subContent">
    <div class="profile-header">
        <div class="profile-avatar">
            👤
            <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">
                📷
            </div>
            <input type="file" id="avatarInput" style="display: none;" accept="image/*">
        </div>
        <h1></h1>
        <p></p>
    </div>

    <form class="profile-form" id="profileForm">
        <div class="form-section">
            <h2>📋 Información Personal</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Nombre</label>
                    <input type="text" id="firstName" placeholder="Nombre" value="" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName"  placeholder="Apellido" value="" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email"  placeholder="juanandres@gmail..." value="" required>
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" placeholder="+598...." value="">
                </div>
            </div>
            <div class="form-group full-width">
                <label for="bio">Biografía</label>
                <textarea id="bio" placeholder="Cuéntanos sobre ti..."></textarea>
            </div>
        </div>

        <div class="form-section">
            <h2>💼 Información Profesional</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="jobTitle">Título Profesional</label>
                    <input type="text" id="jobTitle"  placeholder="Titulo" value="">
                </div>
                <div class="form-group">
                    <label for="experience">Experiencia</label>
                    <select id="experience">
                        <option value="">Seleccionar</option>
                        <option value="0-1">Menos de 1 año</option>
                        <option value="1-3" selected>1-3 años</option>
                        <option value="3-5">3-5 años</option>
                        <option value="5+">Más de 5 años</option>
                    </select>
                </div>
            </div>
           

        <div class="form-section">
            <h2>📍 Ubicación</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="city">Ciudad</label>
                    <input type="text" id="city" value="">
                </div>
                <div class="form-group">
                    <label for="country">País</label>
                    <input type="text" id="country" value="">
                </div>
            </div>
            <div class="form-group full-width">
                <label for="address">Dirección (opcional)</label>
                <input type="text" id="address" placeholder="Ej: Av. 18 de Julio 1234">
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Cancelar</button>
            <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
        </div>
    </form>
</div>

<script src="perfil.js"></script>
        
    </div>

  </section>
