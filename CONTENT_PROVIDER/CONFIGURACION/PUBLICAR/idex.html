<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Servicio</title>
    <link rel="stylesheet" href="../../../general.css">
    <link rel="stylesheet" href="../../../CONTENT/CONFIGURACIONES/configuraciones.css">
    <link rel="stylesheet" href="publicar.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <h2 class="logo">JobWires</h2>
            <div id="btn_nav"></div>
            <ul class="nav-links">
                <li><a href="../../../index.html">Inicio</a></li>
                <li><a href="../../../CONTENT/CHAT/index.html">Chat</a></li>
                <li id="navSelect"><a href="./CONFIGURACION/SERVICIOS/index.html">Configuraciones</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <div class="subNav">
            <nav>
                <ul>
                    <li><a href="../USUARIO/index.html">Perfil</a></li>
                    <li><a href="../SERVICIOS/index.html">Mi servicios</a></li>
                    <li><a href="../NOTIFICACION/index.html">Notificacion</a></li>
                    <li><a href="../SEGURIDAD/index.html">Seguridad</a></li>
                    <li><a href="../PREFERENCIA/index.html">Preferencias</a></li>
                    <li id="subNavSelect"><a href="./index.html">Publicar Servicio</a></li>
                    <li><a href="../SESION/index.html">Cerrar Sesion</a></li>
                </ul>
            </nav>
        </div>

        <div class="subContent">
            <form action="#" id="formToPublic">
                <input type="text" name="title" id="title" placeholder="Título" required>
                <textarea name="description" id="description" placeholder="Descripción" required></textarea>
                <input type="text" name="price" id="price" placeholder="Precio" required>
                <input type="text" name="ubication" id="ubication" placeholder="Ubicación">
                
                <!-- Upload de imagen -->
                <div class="upload-container" id="uploadContainer">
                    <label for="imageInput" class="upload-label">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">Haz clic o arrastra una imagen</div>
                        <div class="upload-text" style="font-size: 10px; color: #999;">JPG, PNG (máx. 5MB)</div>
                    </label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                
                <div class="image-preview" id="imagePreview">
                    <div class="preview-wrapper">
                        <img id="previewImg" class="preview-image" alt="Preview">
                        <button type="button" class="remove-image" id="removeImage">×</button>
                    </div>
                </div>
                
                <div class="section-title">📅 Fecha y horario</div>
                
                <div class="calendario-mini">
                    <div class="cal-header">
                        <button type="button" id="prevMes">‹</button>
                        <span id="mesAnio"></span>
                        <button type="button" id="nextMes">›</button>
                    </div>
                    
                    <div class="cal-grid">
                        <div class="cal-day-name">D</div>
                        <div class="cal-day-name">L</div>
                        <div class="cal-day-name">M</div>
                        <div class="cal-day-name">M</div>
                        <div class="cal-day-name">J</div>
                        <div class="cal-day-name">V</div>
                        <div class="cal-day-name">S</div>
                    </div>
                    
                    <div class="cal-grid" id="diasGrid"></div>
                    
                    <div id="horariosSection" style="display: none;">
                        <div class="horarios-mini" id="horariosGrid"></div>
                    </div>
                    
                    <div id="fechaInfo" class="fecha-info" style="display: none;"></div>
                </div>

                <input type="submit" id="send" value="Publicar">
            </form>
            
            <div id="message"></div>
            
            <div id="citasLista" class="citas-lista"></div>
        </div>
    </section>

    <script type="module" src="./publicar.js"></script>
    <script src="../../../navSwitched.js"></script>
</body>
</html>
